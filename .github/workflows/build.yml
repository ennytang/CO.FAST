name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CoFast.sln

      - name: Build
        run: dotnet build CoFast.sln -c Release --no-restore

      - name: Test
        run: dotnet test CoFast.sln -c Release --no-build --verbosity normal

      - name: Publish single-file exe
        run: >
          dotnet publish src/CoFast/CoFast.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: CoFast-win-x64
          path: publish/CoFast.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/CoFast.exe
          generate_release_notes: true
